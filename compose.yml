services:

  postgres:
    image: postgres:16.2
    volumes:
      - .data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    logging:
      driver: none
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      timeout: 5s
      interval: 5s
      retries: 5
    ports:
      - "${COMPOSE_POSTGRES_PORT}:5432"

  redis:
    image: redis:7.2
    logging:
      driver: none
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      interval: 5s
      retries: 5
    ports:
      - "${COMPOSE_REDIS_PORT}:6379"

  django:
    build:
      dockerfile: Dockerfile
    command: "python manage.py runserver 0.0.0.0:${COMPOSE_DJANGO_PORT}"
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - USE_DOCKER=true
    env_file:
      - .env
    ports:
      - "${COMPOSE_DJANGO_PORT}:${COMPOSE_DJANGO_PORT}"
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${COMPOSE_DJANGO_PORT}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      dockerfile: Dockerfile
    command: "celery -A seed.app worker --loglevel=info"
    volumes:
      - .:/app
    environment:
      - USE_DOCKER=true
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      dockerfile: Dockerfile
    command: "celery -A seed.app beat --scheduler django_celery_beat.schedulers:DatabaseScheduler --loglevel=info"
    volumes:
      - .:/app
    environment:
      - USE_DOCKER=true
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

